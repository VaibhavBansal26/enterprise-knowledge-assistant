name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - name: Tests
        run: dotnet test --no-build -c Release --filter "Category!=Eval"
      # Quality and safety gate: fails the build on a leak, an injection, a PII exposure, a metric below its floor,
      # or a regression against evals/baseline.json. Runs the offline stand-ins, so it needs no API keys.
      - name: Eval regression gate
        run: dotnet test --no-build -c Release --filter "Category=Eval"
      - name: Publish eval report
        if: always()
        run: |
          if [ -f evals/results/latest.md ]; then cat evals/results/latest.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: evals/results/
          if-no-files-found: ignore

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
