# FREE deployment (Render free tier + Neon free Postgres + Auth0 free). Setup steps: docs/DEPLOY-FREE.md
# Dashboard > New > Blueprint > pick this repository. Values marked sync: false are asked for at creation.
#
#   kb-web  static site (free, always on, no instance hours)  ->  kb-api  free web service  ->  kb-redis  free Key Value
#                                                                      \-> Neon Postgres (external, you create it)
#   sign-in: Auth0 (external, you create it)
#
# Names below must be unique across Render. If "kb-vb26-*" is taken, rename here and in the env values.
services:
  - type: keyvalue
    name: kb-vb26-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []             # private network only

  - type: web
    name: kb-vb26-api
    runtime: docker
    plan: free                  # sleeps after 15 idle minutes; the first request then takes about a minute
    dockerfilePath: ./src/Api/Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    envVars:
      - { key: PORT, value: "8080" }
      - { key: ASPNETCORE_ENVIRONMENT, value: Production }
      - { key: ASPNETCORE_FORWARDEDHEADERS_ENABLED, value: "true" }
      # Neon *direct* connection string (host without "-pooler"): postgresql://user:pass@ep-xxx.neon.tech/neondb?sslmode=require
      - { key: Database__ConnectionString, sync: false }
      - { key: Database__MigrateOnStartup, value: "true" }   # the old instance keeps serving until the new one is healthy
      - key: Redis__ConnectionString
        fromService: { type: keyvalue, name: kb-vb26-redis, property: connectionString }
      # Free web services have no disk: uploaded originals are lost on every restart or spin-down. Search data
      # (chunks, embeddings) lives in Postgres and survives; reprocessing a lost original needs a re-upload.
      - { key: Storage__RootPath, value: /tmp/blobs }
      # The web app's origin, e.g. https://kb-vb26-web.onrender.com (no trailing slash)
      - { key: Cors__AllowedOrigins__0, sync: false }
      # Auth0 tenant issuer WITH the trailing slash, e.g. https://dev-abc123.us.auth0.com/
      - { key: Auth__Authority, sync: false }
      - { key: Auth__Audience, value: kb-api }
      - { key: Auth__RolesClaim, value: "https://kb-assistant.example/roles" }
      - { key: Auth__TenantClaim, value: "https://kb-assistant.example/tenant_id" }
      - { key: Auth__NameClaim, value: "https://kb-assistant.example/name" }
      - { key: Llm__Provider, value: extractive }   # "anthropic" plus the key below for real answers
      - { key: Llm__Anthropic__ApiKey, sync: false }
      - { key: Usage__DefaultMonthlyCostLimitUsd, value: "5" }

  - type: web
    name: kb-vb26-web
    runtime: static
    buildCommand: cd web && npm ci && npm run build
    staticPublishPath: web/dist
    routes:
      - { type: rewrite, source: /*, destination: /index.html }   # single-page-app fallback
    headers:
      - { path: /*, name: X-Content-Type-Options, value: nosniff }
      - { path: /*, name: X-Frame-Options, value: DENY }
      - { path: /*, name: Referrer-Policy, value: strict-origin-when-cross-origin }
    envVars:
      - { key: NODE_VERSION, value: "22" }
      # The API's origin, e.g. https://kb-vb26-api.onrender.com
      - { key: VITE_API_URL, sync: false }
      # Same Auth0 issuer, with the trailing slash, and the SPA application's Client ID
      - { key: VITE_OIDC_AUTHORITY, sync: false }
      - { key: VITE_OIDC_CLIENT_ID, sync: false }
      - { key: VITE_OIDC_AUDIENCE, value: kb-api }
      - { key: VITE_OIDC_SCOPE, value: "openid profile email offline_access" }
      - { key: VITE_OIDC_ROLES_CLAIM, value: "https://kb-assistant.example/roles" }
